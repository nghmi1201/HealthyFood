<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator BMI - BMR - TDEE</title>

    <style>

        * {

            box-sizing: border-box;

        }

        body {

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            margin: 0;

            padding: 30px;

        }

        .container {

            width: 500px;

            max-width: 100%;

            margin: auto;

            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow: 0 0 10px #aaa;

        }

        h1 {

            text-align: center;

            color: #333;

        }

        .form-group {

            margin-bottom: 15px;

        }

        label {

            display: block;

            margin-bottom: 5px;

            font-weight: bold;

        }

        input, select {

            width: 100%;

            padding: 10px;

            border: 1px solid #aaa;

            border-radius: 5px;

        }

        button {

            width: 48%;

            padding: 12px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;

        }

        #calculateBtn {

            background: #198754;

            color: white;

        }

        #resetBtn {

            background: #dc3545;

            color: white;

        }

        .buttons {

            display: flex;

            justify-content: space-between;

        }

        #error {

            color: red;

            margin-top: 10px;

        }

        #result {

            margin-top: 20px;

            padding: 15px;

            background: #f5f5f5;

            border-radius: 5px;

            display: none;

        }

        #result h2 {

            margin-top: 0;

        }

        .result-item {

            margin: 8px 0;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>Calculator</h1>

    <div class="form-group">

        <label for="gender">Giới tính:</label>

        <select id="gender">

            <option value="">-- Chọn giới tính --</option>

            <option value="male">Nam</option>

            <option value="female">Nữ</option>

        </select>

    </div>

    <div class="form-group">

        <label for="age">Tuổi:</label>

        <input type="number" id="age" placeholder="Nhập tuổi">

    </div>

    <div class="form-group">

        <label for="weight">Cân nặng (kg):</label>

        <input type="number" id="weight" placeholder="Nhập cân nặng">

    </div>

    <div class="form-group">

        <label for="height">Chiều cao (cm):</label>

        <input type="number" id="height" placeholder="Nhập chiều cao">

    </div>

    <div class="form-group">

        <label for="activity">Mức độ hoạt động:</label>

        <select id="activity">

            <option value="">-- Chọn mức độ --</option>

            <option value="1.2">Ít vận động</option>

            <option value="1.375">Vận động nhẹ (1-3 ngày/tuần)</option>

            <option value="1.55">Vận động vừa (3-5 ngày/tuần)</option>

            <option value="1.725">Vận động nhiều (6-7 ngày/tuần)</option>

            <option value="1.9">Vận động rất nhiều</option>

        </select>

    </div>

    <div class="buttons">

        <button id="calculateBtn">Tính toán</button>

        <button id="resetBtn">Xóa</button>

    </div>

    <div id="error"></div>

    <div id="result">

        <h2>Kết quả</h2>

        <div class="result-item">

            <strong>BMI:</strong>

            <span id="bmiResult"></span>

        </div>

        <div class="result-item">

            <strong>Đánh giá BMI:</strong>

            <span id="bmiStatus"></span>

        </div>

        <div class="result-item">

            <strong>BMR:</strong>

            <span id="bmrResult"></span> kcal/ngày

        </div>

        <div class="result-item">

            <strong>TDEE:</strong>

            <span id="tdeeResult"></span> kcal/ngày

        </div>

        <div class="result-item">

            <strong>Cân nặng khỏe mạnh:</strong>

            <span id="healthyWeightResult"></span>

        </div>

    </div>

</div>

<script>

    // ==============================

    // TÍNH BMI

    // ==============================

    function calculateBMI(weight, height) {

        // Đổi chiều cao từ cm sang m

        let heightMeter = height / 100;

        let bmi = weight / (heightMeter * heightMeter);

        return bmi;

    }

    // ==============================

    // TÍNH BMR

    // ==============================

    function calculateBMR(gender, weight, height, age) {

        let bmr;

        /*

            Công thức Mifflin-St Jeor:

            Nam:

            BMR = 10W + 6.25H - 5A + 5

            Nữ:

            BMR = 10W + 6.25H - 5A - 161

        */

        if (gender === "male") {

            bmr = 10 * weight + 6.25 * height - 5 * age + 5;

        } else {

            bmr = 10 * weight + 6.25 * height - 5 * age - 161;

        }

        return bmr;

    }

    // ==============================

    // TÍNH TDEE

    // ==============================

    function calculateTDEE(bmr, activityLevel) {

        let tdee = bmr * activityLevel;

        return tdee;

    }

    // ==============================

    // TÍNH CÂN NẶNG KHỎE MẠNH

    // ==============================

    function calculateHealthyWeight(height) {

        let heightMeter = height / 100;

        /*

            BMI khỏe mạnh:

            18.5 -> 24.9

            Cân nặng = BMI × chiều cao²

        */

        let minWeight = 18.5 * heightMeter * heightMeter;

        let maxWeight = 24.9 * heightMeter * heightMeter;

        return {

            min: minWeight,

            max: maxWeight

        };

    }

    // ==============================

    // VALIDATION

    // ==============================

    function validateCalculator() {

        let gender = document.getElementById("gender").value;

        let age = Number(document.getElementById("age").value);

        let weight = Number(document.getElementById("weight").value);

        let height = Number(document.getElementById("height").value);

        let activity = document.getElementById("activity").value;

        let error = document.getElementById("error");

        error.innerHTML = "";

        if (gender === "") {

            error.innerHTML = "Vui lòng chọn giới tính!";

            return false;

        }

        if (age <= 0 || age > 120) {

            error.innerHTML = "Tuổi phải lớn hơn 0 và không quá 120!";

            return false;

        }

        if (weight <= 0 || weight > 500) {

            error.innerHTML = "Cân nặng không hợp lệ!";

            return false;

        }

        if (height <= 0 || height > 250) {

            error.innerHTML = "Chiều cao không hợp lệ!";

            return false;

        }

        if (activity === "") {

            error.innerHTML = "Vui lòng chọn mức độ hoạt động!";

            return false;

        }

        return true;

    }

    // ==============================

    // HIỂN THỊ KẾT QUẢ

    // ==============================

    function displayResult(bmi, bmr, tdee, healthyWeight) {

        document.getElementById("bmiResult").innerText =

            bmi.toFixed(2);

        document.getElementById("bmrResult").innerText =

            bmr.toFixed(0);

        document.getElementById("tdeeResult").innerText =

            tdee.toFixed(0);

        document.getElementById("healthyWeightResult").innerText =

            healthyWeight.min.toFixed(1)

            + " - "

            + healthyWeight.max.toFixed(1)

            + " kg";

        // Đánh giá BMI

        let status = "";

        if (bmi < 18.5) {

            status = "Thiếu cân";

        }

        else if (bmi < 25) {

            status = "Bình thường";

        }

        else if (bmi < 30) {

            status = "Thừa cân";

        }

        else {

            status = "Béo phì";

        }

        document.getElementById("bmiStatus").innerText = status;

        // Hiện khu vực kết quả

        document.getElementById("result").style.display = "block";

    }

    // ==============================

    // RESET

    // ==============================

    function resetCalculator() {

        document.getElementById("gender").value = "";

        document.getElementById("age").value = "";

        document.getElementById("weight").value = "";

        document.getElementById("height").value = "";

        document.getElementById("activity").value = "";

        document.getElementById("error").innerHTML = "";

        document.getElementById("result").style.display = "none";

    }

    // ==============================

    // EVENT

    // ==============================

    document.getElementById("calculateBtn").addEventListener("click", function () {

        // Kiểm tra dữ liệu

        if (!validateCalculator()) {

            return;

        }

        // Lấy dữ liệu từ DOM

        let gender = document.getElementById("gender").value;

        let age = Number(document.getElementById("age").value);

        let weight = Number(document.getElementById("weight").value);

        let height = Number(document.getElementById("height").value);

        let activity = Number(document.getElementById("activity").value);

        // Tính toán

        let bmi = calculateBMI(weight, height);

        let bmr = calculateBMR(

            gender,

            weight,

            height,

            age

        );

        let tdee = calculateTDEE(

            bmr,

            activity

        );

        let healthyWeight =

            calculateHealthyWeight(height);

        // Hiển thị kết quả

        displayResult(

            bmi,

            bmr,

            tdee,

            healthyWeight

        );

    });

    document.getElementById("resetBtn").addEventListener("click", function () {

        resetCalculator();

    });

</script>

</body>

</html>
